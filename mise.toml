[tools]
git-cliff = "2"
go = "1.25"
hcl2json = "latest"
nomad = "2"
nomad-pack = { version = "0.4.2", checksum_url = "https://releases.hashicorp.com/nomad-pack/{{ version }}/nomad-pack_{{ version }}_SHA256SUMS", url = 'https://releases.hashicorp.com/nomad-pack/{{ version }}/nomad-pack_{{ version }}_{{ os(macos="darwin") }}_{{ arch(x64="amd64") }}.zip', version_date_expr = "map(flatten(map(bodies, { fromJSON(#) })), { [#.version, #.timestamp_created] })", version_date_next_expr = 'len(fromJSON(body)) == 20 ? split(url, "&after=")[0] + "&after=" + last(fromJSON(body)).timestamp_created : nil', version_date_url = "https://api.releases.hashicorp.com/v1/releases/nomad-pack?limit=20", version_expr = "fromJSON(body).versions | keys() | sortVersions()", version_list_url = "https://releases.hashicorp.com/nomad-pack/index.json" }
"pipx:bump-my-version" = "1"
shellcheck = "0.11"
terraform-docs = "0.24"

[env]
GO_TEST_TIMEOUT = "{{ get_env(name='GO_TEST_TIMEOUT', default='10m') }}"

[tasks.pre-commit]
description = "Run pre-commit"
run = "pre-commit run --all-files --color always"

[tasks.fmt]
description = "Format files"
run = "nomad fmt -recursive ."
dir = "{{ cwd }}"

[tasks."bump-version"]
description = "Bump the project version"
run = "bump-my-version bump --new-version $( git-cliff --bump --bumped-version --output - )"

[tasks.git-push]
description = "Push the current branch and related tags"
run = "git push --follow-tags origin HEAD"

[tasks.update-changelogs]
description = "Update all pack changelogs"
run = """
  #!/usr/bin/env bash
  set -e

  for path in packs/* ; do
    [[ -d "$path" ]] || continue
    echo "--> $path" >&2
    git-cliff --include-path "${path}/**" --output "${path}/CHANGELOG.md"
  done

  if [[ "$1" == "--commit" ]] ; then
    git add --update -- '*/CHANGELOG.md'
    [[ -z "$( git diff --staged -- '*/CHANGELOG.md' )" ]] || git commit -m "docs: update changelogs"
  fi
"""

[tasks.test]
description = "Run tests"
run = [
  "[ -f go.sum ] || go mod tidy",
  "go test -v -count 1 -timeout {{ env.GO_TEST_TIMEOUT }}",
]
dir = "{{ config_root }}/test"
